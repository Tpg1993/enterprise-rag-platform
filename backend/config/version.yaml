application:
  name: "enterprise-rag-platform"
  version: "4.0.0"
  environment: "development"

models:
  llm:
    provider: "sarvam"
    model: "sarvam-105b"
    version: "1.0.0"
  embedding:
    model: "bge-m3"
    provider: "local"
    version: "1.0.0"
  reranker:
    model: "bge-reranker-large"
    provider: "local"
    version: "1.0.0"

rag:
  basic:
    version: "1.0.0"
    framework: "none"
  hybrid:
    version: "1.0.0"
    framework: "none"
  mmr:
    version: "1.0.0"
    framework: "none"
  reranked:
    version: "1.0.0"
    framework: "none"
  parent_child:
    version: "1.0.0"
    framework: "none"
  multi_query:
    version: "1.0.0"
    framework: "langchain"
  hyde:
    version: "1.0.0"
    framework: "langchain"
  adaptive:
    version: "1.0.0"
    framework: "langgraph"
  corrective:
    version: "1.0.0"
    framework: "langgraph"
  self_rag:
    version: "1.0.0"
    framework: "langgraph"
  react:
    version: "1.0.0"
    framework: "langgraph"
  graph_rag:
    version: "1.0.0"
    framework: "langgraph"
  sql_rag:
    version: "1.0.0"
    framework: "langgraph"
  multimodal:
    version: "1.0.0"
    framework: "langgraph"
  hybrid_graph_agentic:
    version: "1.0.0"
    framework: "langgraph"
  hierarchical_multi_agent:
    version: "1.0.0"
    framework: "langgraph"
  agentic_web_rag:
    version: "1.0.0"
    framework: "langgraph"

security:
  opa_guardrails:
    version: "1.0.0"
    framework: "open-policy-agent"
  presidio_pii:
    version: "1.0.0"
    framework: "microsoft-presidio"

prompts:
  grounding_version: "v1.0"
  system_version: "v1.0"

evaluation_dataset:
  version: "v1.0"
