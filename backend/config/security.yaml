rbac:
  roles:
    - name: ADMIN
      permissions: ["*"]
    - name: ANALYST
      permissions: ["documents:upload", "rag:compare", "evaluations:read", "traces:read"]
    - name: USER
      permissions: ["chat:execute", "sources:read"]
    - name: VIEWER
      permissions: ["dashboards:read"]

pii:
  enabled: true
  entities: ["PERSON", "EMAIL_ADDRESS", "PHONE_NUMBER", "US_SSN", "CREDIT_CARD"]
  anonymization_type: "replace"

agent_guardrails:
  max_iterations: 10
  max_execution_time_seconds: 45
  max_tool_calls: 15
  max_cost_usd: 0.50
