name: Enterprise RAG CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'sarvam-105b-**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Code Quality & Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Ruff Linter
        run: uv run ruff check backend/src backend/tests

      - name: Ruff Formatter Check
        run: uv run ruff format --check backend/src backend/tests

  test-suite:
    name: Test Suite (Unit & Integration)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    env:
      ENVIRONMENT: test
      MOCK_LLM: "true"
      SECRET_KEY: test-secret-key-placeholder-32-chars-min
      QDRANT_HOST: localhost
      REDIS_HOST: localhost
      POSTGRES_HOST: localhost
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Run Unit Tests
        run: uv run pytest backend/tests/unit/ -v --durations=10

      - name: Run Integration Tests
        run: uv run pytest backend/tests/integration/ -v --durations=10

      - name: Benchmark Sanity Check
        run: uv run python -m src.evaluation.run_benchmarks --strategies Basic,Hybrid,Hybrid-Graph-Agentic --limit 2
        working-directory: ./backend

  docker-build:
    name: Container Build & Healthcheck
    runs-on: ubuntu-latest
    needs: test-suite
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: enterprise-rag:latest
          load: true

      - name: Verify Container Architecture
        run: |
          docker inspect enterprise-rag:latest | grep -i "Architecture" || true
