[project]
name = "enterprise-rag-platform"
version = "3.3.0"
description = "Enterprise Multi-Architecture Production-Grade RAG & Agentic AI Platform (Sarvam AI + LangChain + LangGraph + LangSmith)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "DeepMind Agentic Engineering", email = "dev@enterprise.ai" }
]

dependencies = [
    "fastapi>=0.110.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sarvamai",
    "httpx>=0.27.0",
    "langchain>=0.1.10",
    "langchain-community>=0.0.25",
    "langgraph>=0.0.26",
    "langsmith>=0.1.15",
    "qdrant-client>=1.8.0",
    "redis>=5.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "neo4j>=5.18.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=2.5.0",
    "pymupdf>=1.23.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0.1",
    "opentelemetry-api>=1.23.0",
    "opentelemetry-sdk>=1.23.0",
    "prometheus-client>=0.20.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-pyyaml>=6.0.12",
    "selenium>=4.18.0",
    "sqlglot>=30.18.0",
    "pyjwt>=2.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-pyyaml>=6.0.12",
]
eval = [
    "ragas>=0.1.0",
    "deepeval>=0.20.0",
]
security = [
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "backend"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
