version: '3.8'

services:
  # -----------------------------------------------------------------
  # CORE PROFILE (Default local development)
  # -----------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["core"]
    container_name: rag_api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - MOCK_LLM=true
      - QDRANT_HOST=qdrant
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.10.0
    profiles: ["core"]
    container_name: rag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    profiles: ["core"]
    container_name: rag_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    profiles: ["core"]
    container_name: rag_postgres
    environment:
      POSTGRES_DB: rag_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password_placeholder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------------
  # GRAPH PROFILE (GraphRAG backend)
  # -----------------------------------------------------------------
  neo4j:
    image: neo4j:5.18.0
    profiles: ["graph"]
    container_name: rag_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/neo4j_password_placeholder
    volumes:
      - neo4j_data:/data

  # -----------------------------------------------------------------
  # SEARCH PROFILE (Lexical index alternative)
  # -----------------------------------------------------------------
  opensearch:
    image: opensearchproject/opensearch:2.12.0
    profiles: ["search"]
    container_name: rag_opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - "9200:9200"

  # -----------------------------------------------------------------
  # OBSERVABILITY PROFILE (Prometheus & Grafana)
  # -----------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    profiles: ["observability"]
    container_name: rag_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:10.4.0
    profiles: ["observability"]
    container_name: rag_grafana
    ports:
      - "3001:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false

  # -----------------------------------------------------------------
  # SECURITY PROFILE (Open Policy Agent)
  # -----------------------------------------------------------------
  opa:
    image: openpolicyagent/opa:0.62.0
    profiles: ["security"]
    container_name: rag_opa
    ports:
      - "8181:8181"
    volumes:
      - ./docker/opa/policies:/policies:ro
    command:
      - "run"
      - "--server"
      - "--addr=:8181"
      - "/policies"

volumes:
  qdrant_storage:
  redis_data:
  postgres_data:
  neo4j_data:
